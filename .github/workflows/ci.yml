name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      trials:
        description: Checked trials per benchmark case (1–10)
        type: number
        default: 3
      nats_ref:
        description: NATS branch, tag or commit (resolved SHA is recorded)
        type: string
        default: main
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Models, protocol and process failures
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PROPTEST_CASES: 256
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: debug
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Dashboard and benchmark-data tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/benchmark_dashboard.test.cjs
      - run: cargo test --locked --all-features
      - name: Extended projection and group histories
        run: |
          PROPTEST_CASES=1024 cargo test --locked --all-features --test durable_model tree_projections
          PROPTEST_CASES=2048 cargo test --locked --all-features --test durable_model mixed_groups
          PROPTEST_CASES=1024 cargo test --locked --all-features --test durable_model ack_floors_refine
          PROPTEST_CASES=1024 cargo test --locked --all-features --test durable_model mixed_ack_batches_refine
          PROPTEST_CASES=1024 cargo test --locked --all-features --test core_model token_index_refines
          PROPTEST_CASES=1024 cargo test --locked --all-features --lib immediate_reply_partial
          PROPTEST_CASES=1024 cargo test --locked --all-features --lib partial_output_refines
          PROPTEST_CASES=1024 cargo test --locked --all-features --lib core_burst_refines
          PROPTEST_CASES=4096 cargo test --locked --all-features --test protocol subject_validation
      - run: cargo build --locked --features fault-injection
      - run: cc -shared -fPIC -O2 -Wall -Wextra -Werror -o sqlite-io-fault.so scripts/sqlite_io_fault.c -ldl
      - name: Process kills, stalls, ambiguous writes and recovery
        run: |
          mkdir -p results
          python3 scripts/crash_tests.py target/debug/screech-server --output results/process-tests.json
          python3 scripts/consumer_crash_tests.py target/debug/screech-server --output results/consumer-process-tests.json
          python3 scripts/batch_crash_tests.py target/debug/screech-server --output results/batch-process-tests.json
          python3 scripts/single_crash_tests.py target/debug/screech-server --output results/single-process-tests.json
          python3 scripts/io_failure_tests.py target/debug/screech-server --shim ./sqlite-io-fault.so --output results/io-process-tests.json
          python3 scripts/group_crash_tests.py target/debug/screech-server --shim ./sqlite-io-fault.so --output results/group-process-tests.json
          python3 scripts/core_stall_tests.py target/debug/screech-server --output results/core-stall-tests.json
          python3 scripts/persistent_crash_tests.py target/debug/screech-server --output results/persistent-process-tests.json
          python3 scripts/datasync_stall_tests.py target/debug/screech-server --shim ./sqlite-io-fault.so --output results/datasync-stall-tests.json
          python3 scripts/multi_pull_crash_tests.py target/debug/screech-server --output results/multi-pull-tests.json
          python3 scripts/group_extension_tests.py target/debug/screech-server --shim ./sqlite-io-fault.so --output results/group-extension-tests.json
          python3 scripts/cluster_tests.py target/debug/screech-server --output results/cluster-process-tests.json
          python3 scripts/cluster_recovery_tests.py target/debug/screech-server --output results/cluster-recovery-tests.json
          python3 scripts/cluster_nats_regression_tests.py target/debug/screech-server --shim ./sqlite-io-fault.so --output results/cluster-nats-regressions.json
          python3 scripts/cluster_quorum_tests.py target/debug/screech-server --output results/cluster-quorum-tests.json
          python3 scripts/cluster_direct_read_tests.py target/debug/screech-server --output results/cluster-direct-read-tests.json
          python3 scripts/cluster_journal_tests.py target/debug/screech-server --output results/cluster-journal-tests.json
          python3 scripts/cluster_projection_tests.py target/debug/screech-server --output results/cluster-projection-tests.json
      - name: Automatic cluster checkpoints, cold restart and voter repair
        timeout-minutes: 12
        run: python3 scripts/cluster_checkpoint_tests.py target/debug/screech-server --output results/cluster-checkpoint-tests.json
      - name: Unsafe consumer ACK buffering and durable publication fences
        run: python3 scripts/unsafe_ack_tests.py target/debug/screech-server --shim ./sqlite-io-fault.so --output results/unsafe-ack-tests.json
      - name: Retained content exceeds process memory budget
        run: python3 scripts/content_memory_tests.py target/debug/screech-server --output results/content-memory-tests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: correctness-results
          path: results/
  vm:
    name: Guest power-loss recovery
    needs: test
    uses: ./.github/workflows/vm.yml
  benchmark_build:
    name: Build benchmark binaries once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      binaries_artifact: benchmark-binaries-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nats-io/nats-server
          ref: ${{ inputs.nats_ref || 'main' }}
          path: upstream
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: release
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: |
            tools/bench/go.sum
            upstream/go.sum
      - name: Build production servers and checked driver
        run: |
          mkdir -p bin results
          cargo build --release --locked
          go -C upstream build -o "$GITHUB_WORKSPACE/bin/nats-server" .
          go -C tools/bench build -o "$GITHUB_WORKSPACE/bin/bench-driver" .
          go -C tools/bench test .
          git -C upstream rev-parse HEAD > results/nats-commit.txt
          cp target/release/screech-server bin/screech-server
          python3 scripts/benchmark_build.py create --directory bin --revision "$GITHUB_SHA" \
            --nats-commit "$(cat results/nats-commit.txt)" --rustc "$(rustc --version)"
          tar -C bin -czf benchmark-binaries.tar.gz screech-server nats-server bench-driver benchmark-build.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-binaries.tar.gz
  standalone:
    name: Standalone comparisons
    needs: benchmark_build
    uses: ./.github/workflows/benchmark-timing.yml
    with:
      voters: 1
      trials: ${{ inputs.trials || 3 }}
      binaries_artifact: ${{ needs.benchmark_build.outputs.binaries_artifact }}
  cluster_three:
    name: Clustered comparisons · 3 voters
    needs: benchmark_build
    uses: ./.github/workflows/benchmark-timing.yml
    with:
      voters: 3
      trials: ${{ inputs.trials || 3 }}
      binaries_artifact: ${{ needs.benchmark_build.outputs.binaries_artifact }}
  cluster_five:
    name: Clustered comparisons · 5 voters
    needs: benchmark_build
    uses: ./.github/workflows/benchmark-timing.yml
    with:
      voters: 5
      trials: ${{ inputs.trials || 3 }}
      binaries_artifact: ${{ needs.benchmark_build.outputs.binaries_artifact }}
  profiles:
    name: Diagnostic profiles
    needs: benchmark_build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.benchmark_build.outputs.binaries_artifact }}
      - name: Verify the shared benchmark build
        run: |
          mkdir -p bin
          tar -C bin -xzf benchmark-binaries.tar.gz
          python3 scripts/benchmark_build.py verify --directory bin --revision "$GITHUB_SHA"
      - name: Profile Core forwarding and confirmed consumer ACKs
        run: |
          sudo bash scripts/install_profile_tools.sh
          sudo sysctl kernel.perf_event_paranoid=1
          perf_binary=$(find -L /usr/lib/linux-tools -type f -name perf | sort | tail -1)
          test -n "$perf_binary"
          test -x "$perf_binary"
          sudo python3 scripts/profile_core.py --include-kernel --screech bin/screech-server \
            --nats bin/nats-server --driver bin/bench-driver --perf "$perf_binary" \
            --output core-profiles
          sudo python3 scripts/profile_jetstream.py --include-kernel --screech bin/screech-server \
            --nats bin/nats-server --driver bin/bench-driver --perf "$perf_binary" \
            --output jetstream-profiles
          sudo python3 scripts/profile_publication_io.py --screech bin/screech-server \
            --nats bin/nats-server --driver bin/bench-driver --strace "$(command -v strace)" \
            --output publication-io-profiles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: core-profiles/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jetstream-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: jetstream-profiles/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publication-io-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-io-profiles/
  dashboard:
    name: Assemble checked benchmark dashboard
    needs: [benchmark_build, standalone, cluster_three, cluster_five]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pages_artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      TRIALS: ${{ inputs.trials || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.benchmark_build.outputs.binaries_artifact }}
      - name: Verify the shared benchmark build
        run: |
          mkdir -p bin
          tar -C bin -xzf benchmark-binaries.tar.gz
          python3 scripts/benchmark_build.py verify --directory bin --revision "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.standalone.outputs.timings_artifact }}
          path: results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.cluster_three.outputs.timings_artifact }}
          path: results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.cluster_five.outputs.timings_artifact }}
          path: results
      - name: Verify campaign provenance and report clustered targets
        run: |
          python3 scripts/benchmark_build.py campaigns --directory bin --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            results/standard.json results/concurrent.json results/cluster-3.json results/cluster-5.json
          python3 scripts/check_cluster_targets.py --three results/cluster-3.json --five results/cluster-5.json \
            --minimum-trials "$TRIALS" --report-only --output results/cluster-targets.json
      - name: Retain the complete timing campaign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
      - name: Generate benchmark dashboard
        run: |
          python3 scripts/render_benchmarks.py \
            --input 'CI · standard cases' results/standard.json \
            --input 'CI · larger JetStream cases' results/concurrent.json \
            --input 'CI · cluster · 3 voters' results/cluster-3.json \
            --input 'CI · cluster · 5 voters' results/cluster-5.json \
            --output _site --revision "$GITHUB_SHA" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '### Checked benchmark dashboard\n\n[Published dashboard](https://codyps.github.io/screech/) · Download this run’s benchmark-site artifact for its exact page and raw trials.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
  deploy:
    name: Publish benchmark dashboard
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, vm, profiles, dashboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: ${{ needs.dashboard.outputs.pages_artifact }}
          timeout: '600000'
