[package]
name = "screech"
version = "0.1.0"
edition = "2021"
description = "A testable standalone NATS server in Rust"

[features]
default = []
fault-injection = []

[dependencies]
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
crc32fast = "1"
getrandom = "0.3"
itoa = "1"
fs2 = "0.4"
base64 = "0.22"
postcard = { version = "1", features = ["alloc"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
imbl = { version = "7.0.2", features = ["serde"] }
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
protobuf = "3"
slog = "2"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
tempfile = "3"
async-nats = "0.49"
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[[bin]]
name = "screech-server"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
