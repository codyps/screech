# Enable SQLite's supported data-sync syscall on Linux. FULL still synchronizes
# every commit, including data and file size. Other targets retain their defaults.
[env]
CFLAGS_x86_64_unknown_linux_gnu = "-DHAVE_FDATASYNC=1"
CFLAGS_aarch64_unknown_linux_gnu = "-DHAVE_FDATASYNC=1"
CFLAGS_x86_64_unknown_linux_musl = "-DHAVE_FDATASYNC=1"
CFLAGS_aarch64_unknown_linux_musl = "-DHAVE_FDATASYNC=1"
