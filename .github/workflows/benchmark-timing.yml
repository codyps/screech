name: Checked benchmark timing
on:
  workflow_call:
    inputs:
      voters:
        type: number
        required: true
      trials:
        type: number
        required: true
      binaries_artifact:
        type: string
        required: true
    outputs:
      timings_artifact:
        value: ${{ jobs.timing.outputs.timings_artifact }}
permissions:
  contents: read
jobs:
  timing:
    name: Checked timings
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      timings_artifact: benchmark-timings-r${{ inputs.voters }}-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      TRIALS: ${{ inputs.trials }}
      VOTERS: ${{ inputs.voters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.binaries_artifact }}
      - name: Verify the shared benchmark build
        id: binaries
        run: |
          case "$VOTERS" in 1|3|5) ;; *) exit 1 ;; esac
          mkdir -p bin results
          tar -C bin -xzf benchmark-binaries.tar.gz
          python3 scripts/benchmark_build.py verify --directory bin --revision "$GITHUB_SHA"
          python3 -c 'import json; print(json.load(open("bin/benchmark-build.json"))["nats_commit"])' > results/nats-commit.txt
      - name: Standard cases · FULL, always, 10 ms, default
        if: inputs.voters == 1
        run: |
          python3 scripts/benchmark.py --screech bin/screech-server \
            --nats bin/nats-server --driver bin/bench-driver \
            --nats-commit "$(cat results/nats-commit.txt)" \
            --nats-default --nats-sync-interval 10ms --screech-unsafe-ack --trials "$TRIALS" \
            --reverse --output results/standard.json
      - name: Larger JetStream cases
        if: inputs.voters == 1
        run: |
          python3 scripts/benchmark.py --screech bin/screech-server \
            --nats bin/nats-server --driver bin/bench-driver \
            --nats-commit "$(cat results/nats-commit.txt)" \
            --nats-default --nats-sync-interval 10ms --screech-unsafe-ack --trials "$TRIALS" \
            --scale-only --output results/concurrent.json
      - name: Large-message JetStream cases
        if: inputs.voters == 1
        run: |
          python3 scripts/benchmark.py --screech bin/screech-server \
            --nats bin/nats-server --driver bin/bench-driver \
            --nats-commit "$(cat results/nats-commit.txt)" \
            --nats-default --nats-sync-interval 10ms --screech-unsafe-ack --trials "$TRIALS" \
            --large-messages --output results/large.json
      - name: Standalone JetStream performance target reports
        if: inputs.voters == 1
        run: |
          python3 scripts/check_jetstream_targets.py --standard results/standard.json --concurrent results/concurrent.json --server screech --minimum-trials "$TRIALS" --report-only --output results/jetstream-full-targets.json
          python3 scripts/check_jetstream_targets.py --standard results/standard.json --concurrent results/concurrent.json --server screech-unsafe-ack --minimum-trials "$TRIALS" --report-only --output results/jetstream-unsafe-ack-targets.json
      - name: Complete clustered campaign
        if: inputs.voters != 1
        run: |
          python3 scripts/benchmark.py --screech bin/screech-server --nats bin/nats-server --driver bin/bench-driver \
            --nats-commit "$(cat results/nats-commit.txt)" --cluster-voters "$VOTERS" \
            --cluster-messages 3000 --trials "$TRIALS" --output "results/cluster-$VOTERS.json"
      - name: Verify timing provenance
        run: |
          if [ "$VOTERS" = 1 ]; then
            campaigns=(results/standard.json results/concurrent.json results/large.json)
          else
            campaigns=("results/cluster-$VOTERS.json")
          fi
          python3 scripts/benchmark_build.py campaigns --directory bin --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" "${campaigns[@]}"
      - name: Retain checked timings before performance gates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.binaries.outcome == 'success' }}
        with:
          name: benchmark-timings-r${{ inputs.voters }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
      - name: Check unsafe-ACK JetStream performance targets (advisory)
        id: unsafe_ack_targets
        if: inputs.voters == 1 && inputs.trials >= 3
        continue-on-error: true
        run: python3 scripts/check_jetstream_targets.py --standard results/standard.json --concurrent results/concurrent.json --server screech-unsafe-ack --minimum-trials "$TRIALS" --output results/jetstream-unsafe-ack-targets.json
      - name: Summarize unsafe-ACK performance target misses
        if: inputs.voters == 1 && inputs.trials >= 3 && steps.unsafe_ack_targets.outcome == 'failure'
        run: |
          echo "::warning title=Unsafe-ACK JetStream performance targets missed::Checked timings are still uploaded and published"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          report = json.load(open('results/jetstream-unsafe-ack-targets.json'))
          misses = [case for case in report['cases'] if not case['passed']]
          print('### :warning: Unsafe-ACK JetStream performance target misses')
          print()
          print(f'{len(misses)} of {len(report["cases"])} checked cases missed the '
                'at-least-1.10x throughput and at-most-0.90x p99 targets. '
                'Checked timings are still uploaded and published to the dashboard.')
          print()
          print('| campaign | scenario | payload | throughput | p99 |')
          print('| --- | --- | --- | --- | --- |')
          for case in misses:
              print(f'| {case["campaign"]} | {case["scenario"]} | {case["payload_bytes"]} B '
                    f'| {case["throughput_ratio"]:.3f}x | {case["p99_ratio"]:.3f}x |')
          print()
          print('Full ratios are retained in `jetstream-unsafe-ack-targets.json` inside '
                'the benchmark-timings artifact of this job.')
          PY
